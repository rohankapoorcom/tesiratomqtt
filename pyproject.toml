[project]
name = "tesira2mqtt"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "aiohttp==3.14.3",
    "aiomqtt==2.5.1",
    "pydantic==2.13.5",
    "python-slugify==9.0.0",
    "PyYAML==6.0.3",
    "telnetlib3==5.0.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
log_level = "DEBUG"
