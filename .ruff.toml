# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py312"

# Source files import each other as top-level modules; tests do the same.
src = [".", "src", "tests"]

# Code blocks in the documentation are illustrative; do not lint or format them.
extend-exclude = ["*.md"]

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "CPY001", # Missing copyright notice at top of file (the project does not use them)
    "PLR0917", # Too many positional arguments (companion of PLR0913, handled case by case)
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
]

[lint.per-file-ignores]
"tests/**" = [
    "ANN", # test helpers do not need exhaustive annotations
    "D", # docstrings are optional in tests
    "FBT", # boolean positional values are fine for fake device state
    "INP001", # tests are not a package
    "PLR2004", # magic values are the point of assertions
    "S101", # assert is how tests assert
    "SLF001", # tests may inspect private state
    "TC", # fixtures need their types at runtime for readability
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25